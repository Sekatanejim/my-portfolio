<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Portal | Javascript Bootcamp Task 3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 500px;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .error-message {
            display: block;
            color: #e74c3c;
            font-size: 13px;
            margin-top: 5px;
            min-height: 20px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-group input {
            width: auto;
        }

        .checkbox-group label {
            margin-bottom: 0;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .resend-btn {
            margin-top: 15px;
            background: #3498db;
        }

        .success-msg {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }

        hr {
            margin: 20px 0;
            border: 1px solid #eee;
        }

        .student-records {
            margin-top: 20px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
        }

        .student-records h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .student-item {
            background: white;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 6px;
            border-left: 4px solid #667eea;
            font-size: 14px;
        }

        .sync-demo {
            background: #e8f4f8;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Signup Portal</h1>

        <!-- Synchronous Demo -->
        <div class="sync-demo">
            <h3>🔄 Synchronous Execution Demo</h3>
            <button type="button" id="syncDemoBtn" style="background:#2c3e50; margin-bottom:10px;">Run Synchronous Code</button>
            <div id="syncOutput" style="margin-top:10px; font-size:13px; color:#555;"></div>
        </div>

        <!-- Signup Form -->
        <form id="signupForm">
            <div class="form-group">
                <label>Username *</label>
                <input type="text" id="username" placeholder="Enter your username">
                <span class="error-message" id="usernameError"></span>
            </div>

            <div class="form-group">
                <label>Email *</label>
                <input type="email" id="email" placeholder="Enter your email">
                <span class="error-message" id="emailError"></span>
            </div>

            <div class="form-group">
                <label>Password * (minimum 8 characters)</label>
                <input type="password" id="password" placeholder="Enter your password">
                <span class="error-message" id="passwordError"></span>
            </div>

            <div class="form-group checkbox-group">
                <input type="checkbox" id="terms">
                <label>I agree to the Terms and Conditions</label>
            </div>
            <span class="error-message" id="termsError"></span>

            <button type="submit">Sign Up</button>
        </form>

        
        <button type="button" id="resendBtn" class="resend-btn" disabled>Resend Verification (10s)</button>
        <div id="verificationMsg" style="margin-top:10px; font-size:13px; text-align:center;"></div>

        <hr>

        
        <div class="student-records">
            <h3>Student Database</h3>
            <button type="button" id="loadStudentsBtn" style="background:#27ae60; margin-bottom:15px;">Load All Students (After 3s Delay)</button>
            <div id="studentOutput"></div>
        </div>
    </div>

    <script src="validation.js"></script>
    <script src="async.js"></script>
</body>
</html>
