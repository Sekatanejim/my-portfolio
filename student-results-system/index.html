<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Pass/Fail System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Student Results System</h1>
        
        <!-- Input field for student's name -->
        <div class="form-card">
            <h2>Enter Student Results</h2>
            
            <div class="form-group">
                <label for="studentName">Student Name:</label>
                <input type="text" id="studentName" placeholder="Enter student name">
            </div>
            
            <!-- Input field for student's mark (0-100) -->
            <div class="form-group">
                <label for="studentMark">Student Mark (0-100):</label>
                <input type="number" id="studentMark" placeholder="Enter mark between 0-100" min="0" max="100">
            </div>
            
            <!-- Submit button -->
            <button id="submitBtn">Submit Result</button>
        </div>
        
        
        
        <div id="resultArea" class="result-card">
            <p>Waiting for submission...</p>
        </div>
        
        
        <div class="list-card">
            <h3>Submitted Students</h3>
            <ul id="studentList">
                <li>No students submitted yet</li>
            </ul>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
